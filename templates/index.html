<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emotion Detector</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: 600px;
            width: 100%;
            padding: 40px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
        }
        
        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: bold;
        }
        
        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            font-family: Arial, sans-serif;
            resize: vertical;
            min-height: 120px;
            transition: border-color 0.3s;
        }
        
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .error-message {
            color: #d32f2f;
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }
        
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .results {
            margin-top: 30px;
            display: none;
            background: #f5f5f5;
            padding: 20px;
            border-radius: 5px;
        }
        
        .results.show {
            display: block;
        }
        
        .result-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #ddd;
        }
        
        .result-item:last-child {
            border-bottom: none;
        }
        
        .emotion-label {
            font-weight: bold;
            color: #333;
            text-transform: capitalize;
        }
        
        .emotion-score {
            color: #667eea;
            font-weight: bold;
        }
        
        .dominant {
            background: #e8f5e9;
            padding: 15px;
            margin-top: 15px;
            border-radius: 5px;
            text-align: center;
            border-left: 4px solid #4caf50;
        }
        
        .dominant-label {
            font-size: 12px;
            color: #666;
            margin-bottom: 5px;
        }
        
        .dominant-emotion {
            font-size: 24px;
            color: #4caf50;
            font-weight: bold;
            text-transform: capitalize;
        }
        
        .loading {
            display: none;
            text-align: center;
            color: #667eea;
            margin-top: 20px;
        }
        
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎭 Emotion Detector</h1>
        <p class="subtitle">Analyze emotions in your text using AI</p>
        
        <form id="emotionForm">
            <div class="form-group">
                <label for="textInput">Enter your text:</label>
                <textarea 
                    id="textInput" 
                    placeholder="Type something to analyze its emotions..."
                    required></textarea>
                <div class="error-message" id="errorMessage"></div>
            </div>
            <button type="submit">Analyze Emotion</button>
        </form>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Analyzing emotions...</p>
        </div>
        
        <div class="results" id="results">
            <div class="result-item">
                <span class="emotion-label">Anger</span>
                <span class="emotion-score" id="angerScore">-</span>
            </div>
            <div class="result-item">
                <span class="emotion-label">Disgust</span>
                <span class="emotion-score" id="disgustScore">-</span>
            </div>
            <div class="result-item">
                <span class="emotion-label">Fear</span>
                <span class="emotion-score" id="fearScore">-</span>
            </div>
            <div class="result-item">
                <span class="emotion-label">Joy</span>
                <span class="emotion-score" id="joyScore">-</span>
            </div>
            <div class="result-item">
                <span class="emotion-label">Sadness</span>
                <span class="emotion-score" id="sadnessScore">-</span>
            </div>
            <div class="dominant">
                <div class="dominant-label">DOMINANT EMOTION</div>
                <div class="dominant-emotion" id="dominantEmotion">-</div>
            </div>
        </div>
    </div>
    
    <script>
        const form = document.getElementById('emotionForm');
        const textInput = document.getElementById('textInput');
        const errorMessage = document.getElementById('errorMessage');
        const loading = document.getElementById('loading');
        const results = document.getElementById('results');
        
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const text = textInput.value.trim();
            
            if (!text) {
                errorMessage.textContent = 'Please enter some text to analyze.';
                errorMessage.style.display = 'block';
                results.classList.remove('show');
                return;
            }
            
            errorMessage.style.display = 'none';
            loading.style.display = 'block';
            results.classList.remove('show');
            
            try {
                const response = await fetch('/emotionDetector', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ text_to_analyze: text })
                });
                
                if (!response.ok) {
                    const error = await response.json();
                    errorMessage.textContent = error.error || 'Error analyzing emotions.';
                    errorMessage.style.display = 'block';
                    loading.style.display = 'none';
                    return;
                }
                
                const data = await response.json();
                
                // Update results
                document.getElementById('angerScore').textContent = 
                    (data.anger !== null ? data.anger.toFixed(3) : 'N/A');
                document.getElementById('disgustScore').textContent = 
                    (data.disgust !== null ? data.disgust.toFixed(3) : 'N/A');
                document.getElementById('fearScore').textContent = 
                    (data.fear !== null ? data.fear.toFixed(3) : 'N/A');
                document.getElementById('joyScore').textContent = 
                    (data.joy !== null ? data.joy.toFixed(3) : 'N/A');
                document.getElementById('sadnessScore').textContent = 
                    (data.sadness !== null ? data.sadness.toFixed(3) : 'N/A');
                document.getElementById('dominantEmotion').textContent = 
                    data.dominant_emotion || 'N/A';
                
                loading.style.display = 'none';
                results.classList.add('show');
            } catch (error) {
                errorMessage.textContent = 'Error connecting to server. Please try again.';
                errorMessage.style.display = 'block';
                loading.style.display = 'none';
            }
        });
    </script>
</body>
</html>
